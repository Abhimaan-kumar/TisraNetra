<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title description">
  <title id="title">Red, green, and blue camera test targets</title>
  <desc id="description">Aim the camera at the center of each large colored rectangle.</desc>
  <rect width="960" height="480" fill="white"/>
  <rect x="20" y="20" width="290" height="380" fill="#e53935"/>
  <rect x="335" y="20" width="290" height="380" fill="#43a047"/>
  <rect x="650" y="20" width="290" height="380" fill="#1e88e5"/>
  <g fill="black" font-family="sans-serif" font-size="32" text-anchor="middle">
    <text x="165" y="450">Red</text>
    <text x="480" y="450">Green</text>
    <text x="795" y="450">Blue</text>
  </g>
</svg>
